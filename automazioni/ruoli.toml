# =====================================================================
# Componenti, ruoli e costi orari di Ampalis Team
# Letto dalle automazioni (issue ricorrenti, consuntivo delle ore). Lo tiene
# aggiornato l'Amministratore. Se uno sprint si allunga (Norme di Progetto,
# metodo di lavoro), si spostano le date di quello sprint e dei successivi.
#
# - [componenti]: nome e cognome -> utente GitHub.
# - [[sprint]]: numero, periodo e ruolo di ogni componente, dalla matrice di
#   rotazione della Dichiarazione degli Impegni (Piano di Progetto, tabella
#   della rotazione dei ruoli).
# - previste: ore produttive preventivate per componente e ruolo nello sprint,
#   dal Piano di Progetto (ripartizione della Dichiarazione degli Impegni);
#   Re accanto al ruolo dello sprint sono le ore da Responsabile uscente per
#   l'aggiornamento del Piano di Progetto. Il consuntivo le confronta con le ore
#   effettive.
# - [costi]: costo orario di ogni ruolo, in euro, dalla Dichiarazione degli
#   Impegni.
# Sigle dei ruoli: Re Responsabile, Am Amministratore, An Analista,
# Pg Progettista, Pr Programmatore, Ve Verificatore.
# =====================================================================

