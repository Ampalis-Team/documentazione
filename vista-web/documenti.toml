# =====================================================================
# Vista web della documentazione: testi della pagina e consegne
#
# La pagina si costruisce dai PDF in documentazione-esterna/ e
# documentazione-interna/: tipo, data, versione, titolo e consegna di
# ogni documento si ricavano dal PDF e dal suo nome (regole nelle Norme
# di Progetto e in testa a vista-web/genera.py). Qui i documenti non si
# elencano: il file si modifica solo quando cambiano i testi della
# pagina o le consegne.
#
# - [sito]: testi e collegamenti della pagina.
# - [[consegne]]: id (minuscole, cifre e trattini), titolo e data nel
#   formato AAAA-MM-GG. Ogni PDF va nella prima consegna con data uguale
#   o successiva alla sua, quindi l'ultima consegna chiude il progetto.
# =====================================================================

