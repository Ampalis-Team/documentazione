# =====================================================================
# Vista web della documentazione
#
# Regole:
# - Il repository contiene solo i PDF dei documenti verificati e
#   approvati: un documento compare nella vista web quando il suo PDF
#   è su main, cioè dopo che il Responsabile ha unito la pull request
#   (l'unione equivale all'approvazione del rilascio). Finché il PDF non
#   c'è, la voce resta in attesa e non compare.
# - La pull request che aggiunge un PDF, o ne pubblica una nuova
#   versione, aggiorna qui la voce del documento (titolo, data, versione).
#   Il controllo automatico sulla pull request segnala i PDF non elencati,
#   le voci incomplete e i nomi di file che non seguono le regole.
# - tipo:  "lettera" | "documento" | "verbale" | "diario"
#   uso:   "esterno" | "interno"   (lettera e diario sono sempre esterni)
#   data:  obbligatoria per lettera, verbale e diario, nel formato AAAA-MM-GG
#   versione: obbligatoria per documenti e verbali (X.Y.Z); la lettera e il
#   diario di bordo non hanno versione
# - file: percorso del PDF dalla radice del repository, in
#   documentazione-esterna/ o documentazione-interna/ secondo l'uso.
#   Nomi in minuscolo, parole separate da trattini; se il file ha una data,
#   viene per prima come AAAAMMGG, seguita da un trattino basso
#   (es. 20261021_verbale-interno.pdf).
# - Una sola Lettera di Presentazione per consegna, in evidenza in cima.
#   I verbali e i diari di bordo si ordinano da soli dal più recente;
#   i documenti compaiono nell'ordine di questo elenco.
# =====================================================================

