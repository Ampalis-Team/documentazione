# Vista web della documentazione su GitHub Pages.
# - Su ogni pull request: controlla i PDF (nomi, versione in copertina,
#   registro, consegna) e che ogni PDF già su main, se modificato, abbia una
#   versione più alta.
# - Su main: genera la pagina dai PDF presenti e la pubblica. Non fa commit.
name: Vista web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vista-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  genera:
    name: Genera la vista web
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # serve la storia di main per confrontare le versioni

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa pypdf
        run: python -m pip install pypdf==5.9.0

      - name: Controlla i PDF (pull request)
        if: github.event_name == 'pull_request'
        run: python vista-web/genera.py --controlla --base "origin/${{ github.base_ref }}"

      - name: Genera la pagina
        run: python vista-web/genera.py --uscita _site

      - name: Prepara la pubblicazione (main)
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pubblica:
    name: Pubblica la vista web
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: genera
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: pubblicazione
        uses: actions/deploy-pages@v4
